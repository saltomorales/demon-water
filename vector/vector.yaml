# Skeleton: accept beacons and log them. Parsing, validation, tenant
# allowlist, UA enrichment and the ClickHouse sink come in the next tasks.
data_dir: "${PLATFORM_APP_DIR:-.}/.vector-data"

sources:
  beacon:
    type: http_server
    address: "0.0.0.0:${PORT:-8080}"
    path: /rum
    method: POST
    # sendBeacon sends text/plain; parse JSON later in a remap regardless of Content-Type.
    decoding:
      codec: bytes

sinks:
  stdout:
    type: console
    inputs: [beacon]
    encoding:
      codec: json
